name: Package Brave investmentChecker extension

on:
  push:
    paths:
      - 'browser/brave-extension/**'
      - 'tests/test_collector_ui.js'
      - 'tests/test_portfolio_ui.js'
      - 'tests/test_portfolio_navigation.js'
      - 'tests/test_direct_portfolio.js'
      - 'tests/test_isolated_market_capture.js'
      - 'tests/test_frame_lifecycle.js'
      - 'tests/test_order_preflight.js'
      - 'tests/test_order_ui_probe.js'
      - 'tests/test_orders_history.js'
      - 'tests/test_order_staging.js'
      - 'tests/test_auto_reload.js'
      - 'tests/test_event_update.js'
      - 'tests/test_popup_progress.js'
      - 'tests/test_worker_boot.js'
      - 'tests/test_stable_collector_contract.js'
      - 'tests/fixtures/verified_2_7_1_background.js.txt'
      - 'tests/fixtures/verified_2_7_1_collector.js.txt'
      - '.github/workflows/package-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investmentchecker-extension-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and manifest
        run: |
          for file in browser/brave-extension/*.js; do node --check "$file"; done
          python -m json.tool browser/brave-extension/manifest.json > /dev/null
      - name: Regression test for actual Angular Capitales DOM and sliding paginator
        run: node tests/test_collector_ui.js
      - name: Regression test for private balances and positions
        run: node tests/test_portfolio_ui.js
      - name: Regression test for Tu inversion navigation
        run: node tests/test_portfolio_navigation.js
      - name: Regression test for exact Mi portafolio URL and domain permissions
        run: node tests/test_direct_portfolio.js
      - name: Regression test for background-only market collection
        run: node tests/test_isolated_market_capture.js
      - name: Regression test for frame lifecycle after successful upload
        run: node tests/test_frame_lifecycle.js
      - name: Regression test for private buy proposal and approval safeguards
        run: node tests/test_order_preflight.js
      - name: Regression test for read-only Actinver order UI inspection
        run: node tests/test_order_ui_probe.js
      - name: Verify private order execution status inspection
        run: node tests/test_orders_history.js
      - name: Verify approved Visa order staging without submission
        run: node tests/test_order_staging.js
      - name: Verify new local-file auto reload without interrupting sync
        run: node tests/test_auto_reload.js
      - name: Check event-based Windows update notification
        run: node tests/test_event_update.js
      - name: Regression test for live popup telemetry and verified snapshots
        run: node tests/test_popup_progress.js
      - name: Lock proven 2.7.1 market collector and background capture lifecycle
        run: node tests/test_stable_collector_contract.js
      - name: Smoke test complete 2.8 worker with stable direct capture startup
        run: node tests/test_worker_boot.js
      - name: Build stable folder-layout installer
        run: |
          VERSION=$(python -c "import json;print(json.load(open('browser/brave-extension/manifest.json'))['version'])")
          mkdir -p /tmp/ics-dist/investmentChecker
          cp browser/brave-extension/{manifest.json,background.js,popup.html,popup.js,collector.js,remote.js,private-sync.js,portfolio-collector.js,portfolio-navigator.js,order-preflight.js,order-ui-probe.js,orders-history-probe.js,README.md} /tmp/ics-dist/investmentChecker/
          cp browser/brave-extension/{ACTUALIZAR.cmd,ACTUALIZAR.ps1} /tmp/ics-dist/
          cd /tmp/ics-dist
          zip -q -r "${GITHUB_WORKSPACE}/browser/investmentChecker-brave-v${VERSION}.zip" .
          cp "${GITHUB_WORKSPACE}/browser/investmentChecker-brave-v${VERSION}.zip" "${GITHUB_WORKSPACE}/browser/investmentChecker-brave-latest.zip"
      - name: Publish verified packages and announce new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only announce after the built extension and all tests succeeded.
          # Refresh remote-request from main to preserve user requests.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            # Preserve the latest remote action; do not parse a stale worktree copy.
            git show origin/main:browser/remote-request.json > browser/remote-request.json
            python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('browser/brave-extension/manifest.json').read_text())
          file=Path('browser/remote-request.json')
          control=json.loads(file.read_text())
          control['latest_version']=manifest['version']
          file.write_text(json.dumps(control,ensure_ascii=False,indent=2))
          PY
            git add browser/investmentChecker-brave-v*.zip browser/investmentChecker-brave-latest.zip browser/remote-request.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Package InvestmentChecker and announce published extension version"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
